[package]
name = "ferrite"
version = "0.1.0"
edition = "2021"
authors = ["Minuu Lakshmi Shanmugam"]
description = "A production-minded BitTorrent client in Rust"
license = "MIT"
repository = "https://github.com/MinuuLakshmi17/Ferrite"
readme = "README.md"

[dependencies]
anyhow = "1.0"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = "0.10"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.13"
